org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---- 网络：本机到镜像的 TCP 连接会「假活」（连接在、数据不来）----
# 现象：jstack 里线程停在 NioSocketImpl.timedRead，缓存与 CPU 双停，
#      gradle 要等默认的 30s~5min 超时才重试，构建看起来像卡死。
# 处理：把超时压短，让坏连接快速失败并重连；同时把并发下载数调高，
#      慢但不断的情况下总体吞吐更好。
# 注意：不要设 org.gradle.java.home（会破坏 Gradle 的 JDK 检测）。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.repository.max.tentatives=4
systemProp.org.gradle.internal.repository.initial.backoff=500

# 关掉 Flutter Gradle 插件自己的 ABI 覆盖，让 app/build.gradle.kts 里的
# ndk.abiFilters 真正生效（只打 arm64-v8a）。
# 不关的话：插件会把三套 ABI 都塞进来，abiFilters 被无视，release 包 138MB，
# 而且 armeabi-v7a / x86_64 目录里只有第三方 so、没有 libapp.so 和 libflutter.so,
# 是残缺目录（参考 patrol_helper 的同一处配置）。
disable-abi-filtering=true
