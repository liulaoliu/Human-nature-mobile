name: dlaoshi_app
description: "D哥帮你办 - 英语精读 / 背单词 / 产出训练"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理：Provider + ChangeNotifier（ViewModel 层）
  provider: ^6.1.0

  # 存储：sqflite 是唯一耐久主存（对应旧项目的 server/sqliteStore.ts）
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.0

  # 本机偏好（对应旧项目大量 localStorage 的轻量键）
  shared_preferences: ^2.5.5

  # 数据模型 codegen（禁手写 fromJson/toJson）
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 常用工具
  collection: ^1.18.0
  intl: ^0.20.2

  # 备份导入导出（P6）：选文件、打包 zip、分享出去。
  # 注意：文章正文不做文件导入 —— 一律粘贴原文，所以这里不装 PDF/EPUB 解析包。
  file_picker: ^10.1.9
  share_plus: ^11.0.0
  archive: ^4.0.7

  # 朗读（对应旧项目 node-edge-tts / speechSynthesis）
  flutter_tts: ^4.2.3

  # 录音（跟读练习，二期）
  record: ^6.0.0

  # AI 跑批：客户端直连 /chat/completions（key 只存本机 shared_preferences）
  http: ^1.6.0

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  # 朗读三档里的离线神经档（Kitten int8，模型随包打进 assets/tts/）。
  #
  # 用 packages/neural_tts 这份本地副本，而不是 pub 上的 0.4.1：
  # 0.4.1 的 KittenSession 用了 Java 9 的 InputStream.readNBytes，
  # Android 上要 API 33+ 才有；minSdk 却是 24，于是 Android 10/12
  # 一点「试听一句」就 NoSuchMethodError → 进程被杀（闪退）。
  # 本地副本把那 4 处换成自己循环 read，并让插件 catch Throwable。
  # 详见 packages/neural_tts/CHANGELOG.md 的「本地改动」。
  neural_tts:
    path: packages/neural_tts
  # 朗读三档里的在线档（微软 Edge 朗读接口，音质最好但需要网络）。
  # 锁 0.0.2 而不是 0.0.3：0.0.3 引入 audio_decode → native_toolchain_c ^0.19.2，
  # 和 neural_tts 带的 espeak（要求 ^0.17.4）冲突，pub 直接解不出来。
  flutter_edge_tts: ^0.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 单测里跑真 SQLite（内存库），不用真机
  sqflite_common_ffi: ^2.4.2

  # codegen
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.9.0

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"

# sqlite3 的预编译 native asset 要 GLIBC ≥ 2.33；麒麟 aarch64 开发机只有 2.31，
# `flutter test` 会报 `Couldn't resolve native function 'sqlite3_initialize'`。
# `source: system` 改成 dlopen 系统库（软链 /usr/lib/aarch64-linux-gnu/libsqlite3.so）。
# 同机的 patrol_helper 也是这么配的（见其 AGENTS.md「Kylin FFI 环境」）。
# Windows 开发机没有 sqlite3.dll，不写 name_windows 会直接 `Failed to load
# dynamic library 'sqlite3.dll'`（2026-11-16 踩过）；系统自带 winsqlite3.dll。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/
    # 离线词典（ECDICT）：主表 7.8MB + 变体表 1.1MB + 近似词表 0.3MB。
    # 来自 Web 版 public/ecdict*.tsv，运行时由 lib/data/dictionary_loader.dart 读。
    - assets/ecdict/
    # 离线例句（Tatoeba，6.5MB）：word ⇥ en ⇥ zh。
    # 来自 Web 版 public/tatoeba-en.tsv，运行时由 lib/data/tatoeba_loader.dart 按需抽取。
    - assets/tatoeba/
    # 开发用的真数据样本（一份完整备份 JSON）。
    # 只在 debug 包里从「备份 → 导入内置样本」读它，release 包不引用；
    # 但 pubspec 的 assets 是全局的，所以它仍会打进 release 包（见 docs/TODO.md）。
    - assets/data/
    # 朗读用的离线模型（2026-11-15）：Kitten TTS int8 三个文件 + 音素词典。
    # 共约 30MB，**要打进 APK**（用户要求开箱即用，不许首次启动联网下载）。
    # 运行时由 lib/services/kitten_speech.dart 拷到应用支持目录再交给 neural_tts。
    - assets/tts/
    - assets/tts/kitten/
    # Kokoro-82M q8f16：模型 82MiB + tokenizer + 6 个音色（各 522KB）。
    # 不用 fp16（163MB）：APK 会顶到 200MB 以上，q8f16 听感接近。
    # 用户 2026-11-15 立项换掉 Kitten 的「差强人意」，详见 docs/TODO.md 第二十六件。
    - assets/tts/kokoro/
    - assets/tts/kokoro/voices/
