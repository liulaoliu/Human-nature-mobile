name: dlaoshi_app
description: "D哥帮你办 - 英语精读 / 背单词 / 产出训练"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理：Provider + ChangeNotifier（ViewModel 层）
  provider: ^6.1.0

  # 存储：sqflite 是唯一耐久主存（对应旧项目的 server/sqliteStore.ts）
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.0

  # 本机偏好（对应旧项目大量 localStorage 的轻量键）
  shared_preferences: ^2.5.5

  # 数据模型不走 codegen：lib/models/ 是手写不可变类，JSON 映射在 lib/core/*_json.dart。
  # 为什么不用 freezed / json_serializable 见 AGENTS.md「语言与类型」与
  # docs/ARCHITECTURE.md 第四节（核心是 18 处 identical(...) 快路径依赖「同对象」语义）。

  # 常用工具
  collection: ^1.18.0
  intl: ^0.20.2

  # 备份导入导出（P6）：选文件、打包 zip、分享出去。
  # 注意：文章正文不做文件导入 —— 一律粘贴原文，所以这里不装 PDF/EPUB 解析包。
  file_picker: ^10.1.9
  share_plus: ^11.0.0
  archive: ^4.0.7

  # 朗读（对应旧项目 node-edge-tts / speechSynthesis）
  flutter_tts: ^4.2.3

  # 录音（跟读练习，二期）
  record: ^6.0.0

  # AI 跑批：客户端直连 /chat/completions（key 只存本机 shared_preferences）
  http: ^1.6.0

  cupertino_icons: ^1.0.8
  audioplayers: ^6.8.1
  # 朗读的离线神经档（Kitten int8 + Kokoro-82M int8，模型随包打进 assets/tts/）。
  #
  # 用 packages/neural_tts 这份本地副本，而不是 pub 上的 0.4.1：
  # 0.4.1 的 KittenSession 用了 Java 9 的 InputStream.readNBytes，
  # Android 上要 API 33+ 才有；minSdk 却是 24，于是 Android 10/12
  # 一点「试听一句」就 NoSuchMethodError → 进程被杀（闪退）。
  # 本地副本把那 4 处换成自己循环 read，并让插件 catch Throwable。
  # 详见 packages/neural_tts/CHANGELOG.md 的「本地改动」。
  neural_tts:
    path: packages/neural_tts
  # 朗读三档里的在线档（微软 Edge 朗读接口，音质最好但需要网络）。
  # 锁 0.0.2 而不是 0.0.3：0.0.3 引入 audio_decode → native_toolchain_c ^0.19.2，
  # 和 neural_tts 带的 espeak（要求 ^0.17.4）冲突，pub 直接解不出来。
  flutter_edge_tts: ^0.0.2

  # 英语音素化：misaki 的 Dart 移植（Kokoro 就是在它的输出上训练的）。
  # 用 `package:phonemize`（espeak 教科书 IPA）只有 3.3% 逐字节一致；
  # 换成它 84.8%，再加一条 ɾ→T 到 90.2%。词典我们自己 gzip 打包
  # （assets/lexicons/），见 lib/services/kokoro_g2p.dart。
  malsami: ^0.0.3

  # 词典查不到的词（复数、专名）的兜底：espeak 教科书 IPA，再过
  # lib/core/kokoro_dialect.dart 对齐成 misaki 字母表。
  phonemize: ^1.0.0

  # 真 espeak-ng（Kitten 的音素化用它，不是用 Kotlin 自己写的那套）。
  # neural_tts 已经依赖它（`EspeakPhonemizer` 就在那里），这里是显式声明：
  # 不在 dependencies 里直接 import 会被 depend_on_referenced_packages 拦。
  espeak: ^0.1.3

  # 数字转英文单词（lib/core/tts_number_words.dart）。Kitten 那条路要先把
  # "30,000" 展开成 "thirty thousand" 再查 espeak 词典，否则 Kotlin 的
  # expandDigits 会逐位拆成 "three zero"。本来就是 phonemize 的传递依赖，
  # 这里显式声明只是为了能直接 import。
  number_to_words_english: ^3.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 单测里跑真 SQLite（内存库），不用真机
  sqflite_common_ffi: ^2.4.2

  # 没有 codegen（build_runner / freezed / json_serializable），见上面 dependencies 的说明。

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"

# sqlite3 的预编译 native asset 要 GLIBC ≥ 2.33；麒麟 aarch64 开发机只有 2.31，
# `flutter test` 会报 `Couldn't resolve native function 'sqlite3_initialize'`。
# `source: system` 改成 dlopen 系统库（软链 /usr/lib/aarch64-linux-gnu/libsqlite3.so）。
# 同机的 patrol_helper 也是这么配的（见其 AGENTS.md「Kylin FFI 环境」）。
# Windows 开发机没有 sqlite3.dll，不写 name_windows 会直接 `Failed to load
# dynamic library 'sqlite3.dll'`（2026-11-16 踩过）；系统自带 winsqlite3.dll。
hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/
    # 第三方许可全文：GPL v3 + espeak-ng 版权/来源声明。
    # 设置 → 关于 → 开源许可 里展示（见 lib/main.dart 的 LicenseRegistry）。
    - assets/licenses/
    # 英语音素词典（misaki 的 us_gold / us_silver，gzip 后 1.43MB，原 6.1MB）。
    # 运行时由 lib/services/kokoro_g2p.dart 读。
    - assets/lexicons/
    # 离线词典（ECDICT）：主表 7.8MB + 变体表 1.1MB + 近似词表 0.3MB。
    # 来自 Web 版 public/ecdict*.tsv，运行时由 lib/data/dictionary_loader.dart 读。
    - assets/ecdict/
    # 离线例句（Tatoeba，6.5MB）：word ⇥ en ⇥ zh。
    # 来自 Web 版 public/tatoeba-en.tsv，运行时由 lib/data/tatoeba_loader.dart 按需抽取。
    - assets/tatoeba/
    # 开发用的真数据样本（一份完整备份 JSON）。
    # 只在 debug 包里从「备份 → 导入内置样本」读它，release 包不引用；
    # 但 pubspec 的 assets 是全局的，所以它仍会打进 release 包（见 docs/TODO.md）。
    - assets/data/
    # 朗读用的离线模型：Kitten TTS int8（约 27MB）+ Kokoro-82M int8（88MiB）
    # + 各自的 tokenizer / 音色，外加与音素化共用的 en-us.bin（3.4MB）。
    # **要打进 APK**（用户要求开箱即用，不许首次启动联网下载）。
    # 运行时分别由 lib/services/kitten_speech.dart、kokoro_speech.dart
    # 拷到应用支持目录再交给 neural_tts。
    - assets/tts/
    - assets/tts/kitten/
    # espeak-ng 的数据（官方 18MB 里只带英文用得到的部分）。Kitten 的音素化走真
    # espeak-ng：Kotlin 自带那套「词级词典 + 规则瀑布」在句子上与它只有 36.8% 一致。
    #
    # 为什么把 lang/ 下 33 个子目录全列出来：Flutter 的 assets 目录声明**不递归**，
    # 只列 assets/tts/espeak/lang/ 会漏掉 lang/gmw/en-US，真机上表现为
    # ArgumentError: Unknown voice: en-us（2026-11-17 踩过）。整棵 lang 只有 15KB。
    - assets/tts/espeak/
    - assets/tts/espeak/lang/
    - assets/tts/espeak/lang/aav/
    - assets/tts/espeak/lang/art/
    - assets/tts/espeak/lang/azc/
    - assets/tts/espeak/lang/bat/
    - assets/tts/espeak/lang/bnt/
    - assets/tts/espeak/lang/ccs/
    - assets/tts/espeak/lang/cel/
    - assets/tts/espeak/lang/cus/
    - assets/tts/espeak/lang/dra/
    - assets/tts/espeak/lang/esx/
    - assets/tts/espeak/lang/gmq/
    - assets/tts/espeak/lang/gmw/
    - assets/tts/espeak/lang/grk/
    - assets/tts/espeak/lang/inc/
    - assets/tts/espeak/lang/ine/
    - assets/tts/espeak/lang/ira/
    - assets/tts/espeak/lang/iro/
    - assets/tts/espeak/lang/itc/
    - assets/tts/espeak/lang/jpx/
    - assets/tts/espeak/lang/map/
    - assets/tts/espeak/lang/miz/
    - assets/tts/espeak/lang/myn/
    - assets/tts/espeak/lang/poz/
    - assets/tts/espeak/lang/roa/
    - assets/tts/espeak/lang/sai/
    - assets/tts/espeak/lang/sem/
    - assets/tts/espeak/lang/sit/
    - assets/tts/espeak/lang/tai/
    - assets/tts/espeak/lang/trk/
    - assets/tts/espeak/lang/urj/
    - assets/tts/espeak/lang/zle/
    - assets/tts/espeak/lang/zls/
    - assets/tts/espeak/lang/zlw/
    # Kokoro 用的是 model_quantized.onnx（int8）：q8f16 在 vivo 真机上
    # 输出全是 NaN（见 docs/TESTING.md），fp16 有 163MB 会把 APK 顶到 200MB 以上。
    # 用户 2026-11-15 立项「换掉 Kitten 的差强人意」，详见 docs/TODO.md 第二十六件。
    - assets/tts/kokoro/
    - assets/tts/kokoro/voices/
    # 许可爬行页的背景音（用户 2026-11-20 给的文件，切掉首尾静音后 128kbps
    # 立体声，2.6MB）。运行时由 lib/services/asset_music.dart 用 AssetSource
    # 交给 audioplayers（它会先把 asset 拷到临时目录再播）。
    - assets/audio/